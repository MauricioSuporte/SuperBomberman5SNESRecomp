name: Bug report / Relatar problema
description: Report a reproducible prototype issue without uploading game data.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Do not attach ROMs, extracted assets/audio, memory dumps or save states. Não anexe ROMs, recursos extraídos, dumps ou save states.'
  - type: input
    id: version
    attributes:
      label: Project version / Versão
      placeholder: 'v0.1.0, Windows x64'
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version / Versão do Windows
    validations:
      required: true
  - type: input
    id: rom_hash
    attributes:
      label: ROM CRC32 or SHA-256 (hash only)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and stage / Passos e fase
      description: Include settings, inputs and what actually happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Comportamento esperado
