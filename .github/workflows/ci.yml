name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit-publication.py --history
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
