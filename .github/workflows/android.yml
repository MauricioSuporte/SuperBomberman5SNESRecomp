name: Android APK
# Experimental interpreter-only Android build (docs/ANDROID.md). The APK holds
# no ROM and no generated code; players add their own ROM on the phone.
on:
  push:
    branches: [android]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  # contents: write only to push emulator screenshots to android-ci-shots.
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publication guard
        run: python tools/audit-publication.py
      - name: Install NDK and SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - name: Fetch SDL2 and make icons
        run: |
          bash android/fetch_sdl.sh
          python -m pip install pillow
          python android/make_icons.py
      - name: Build APK
        working-directory: android
        run: |
          # Use the runner's CMake (3.31) instead of the SDK's 3.22.
          echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" > local.properties
          cmake --version | head -1
          set -o pipefail
          ./gradlew --no-daemon assembleRelease -Psb5Abis=arm64-v8a,x86_64 2>&1 | tee ../build.log
      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -nE 'error:|Error|FAILED|What went wrong|undefined reference|CMake Error' build.log \
            | grep -v 'warning' | head -40 \
            | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          for f in $(find android/app/.cxx -name 'CMakeOutput.log' -o -name 'CMakeError.log' 2>/dev/null | head -2); do
            grep -nE 'error' "$f" | head -10 | sed 's/^/::error::/' || true
          done
      - name: Check the APK carries no ROM-derived code
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          unzip -l "$apk" | tee apk-contents.txt
          ! grep -E '\.(sfc|smc|srm)$|src/gen|bank[0-9]+_v2' apk-contents.txt
          grep -q 'lib/arm64-v8a/libmain.so' apk-contents.txt
          grep -q 'lib/x86_64/libmain.so' apk-contents.txt
          grep -q 'assets/sb5/files.txt' apk-contents.txt
          mkdir -p dist && cp "$apk" "dist/superbomberman5-$(cat VERSION)-android-experimental.apk"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test (no ROM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android-emulator-test.sh dist/superbomberman5-*-android-experimental.apk emulator-out
      - name: Report emulator summary
        if: always()
        run: |
          test -f emulator-out/summary.txt && sed 's/^/::notice::/' emulator-out/summary.txt || echo "::warning::no emulator summary"
      - name: Publish emulator results to android-ci-shots
        if: always()
        run: |
          test -d emulator-out || exit 0
          dest="run-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin android-ci-shots && git worktree add shots FETCH_HEAD \
            || { git worktree add --detach shots && (cd shots && git checkout --orphan android-ci-shots && git rm -rfq .); }
          mkdir -p "shots/$dest" && cp -r emulator-out/. "shots/$dest/"
          cd shots && git add "$dest" && git commit -qm "Emulator results for run ${GITHUB_RUN_ID} ($(git -C .. rev-parse --short HEAD))" \
            && git push origin HEAD:refs/heads/android-ci-shots
      - uses: actions/upload-artifact@v4
        with:
          name: superbomberman5-android
          path: dist/*.apk
          if-no-files-found: error
