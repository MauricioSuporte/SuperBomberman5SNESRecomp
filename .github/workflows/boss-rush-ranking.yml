name: Boss Rush ranking

# Moderation of the Boss Rush ranking on Discord: remove one time (category =
# player count, rank = 1-5; the expected time guards against removing the
# wrong line if the board changed meanwhile) and/or post a category's current
# ranking to the channel. The webhook comes from the repository secrets and is
# never printed.
on:
  workflow_dispatch:
    inputs:
      remove:
        description: 'Entry to remove, CATEGORY:RANK (for example 2:1 = 2 players, first place); empty = none'
        required: false
        type: string
      expect_time:
        description: 'Time shown on that line (MM:SS.CC); nothing is removed if it differs'
        required: false
        type: string
      post:
        description: 'Post the current ranking of this category (1-5) to the channel; empty = none'
        required: false
        type: string

permissions:
  contents: read

jobs:
  moderate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove a time from the board
        if: inputs.remove != ''
        env:
          BOSS_RUSH_WEBHOOK: ${{ secrets.BOSS_RUSH_WEBHOOK }}
          BOSS_RUSH_BOARD: ${{ secrets.BOSS_RUSH_BOARD }}
          REMOVE: ${{ inputs.remove }}
          EXPECT_TIME: ${{ inputs.expect_time }}
        run: python3 tools/boss-rush-ranking.py --remove "$REMOVE" --expect-time "$EXPECT_TIME"
      - name: Post a category's ranking
        if: inputs.post != ''
        env:
          BOSS_RUSH_WEBHOOK: ${{ secrets.BOSS_RUSH_WEBHOOK }}
          BOSS_RUSH_BOARD: ${{ secrets.BOSS_RUSH_BOARD }}
          POST: ${{ inputs.post }}
        run: python3 tools/boss-rush-ranking.py --post "$POST"
