name: helper-check
on: push
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          choco install ninja -y --no-progress | Out-Null
          $cm = "C:\cm\cmake-3.31.6-windows-x86_64\bin"
          Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip -OutFile cm.zip
          Expand-Archive cm.zip C:\cm
          $env:PATH = "$cm;$env:PATH"
          $out2 = cmd /c "call fc_check.cmd 2>&1"; $rc2 = $LASTEXITCODE
          $out2 | Where-Object { $_ -match "PASS|FAIL|NOFIX" } | Select-Object -First 30 | ForEach-Object { Write-Output "::notice::fc $_" }
          if ($rc2 -ne 0) { exit 1 }
