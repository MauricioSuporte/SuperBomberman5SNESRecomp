name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching VERSION (without v)'
        type: string
        default: '2.3.1'
      publish_release:
        description: 'Publish audited Linux AppImage and Windows ZIP'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Validate source, version and dependency pins
        run: |
          python -c 'import os,pathlib,re; v=os.environ["RELEASE_VERSION"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); assert pathlib.Path("VERSION").read_text().strip()==v'
          python tools/audit-publication.py --history
          python -m unittest discover -s tests -v
          bash snesrecomp/tools/ci/record_pins.sh --check framework_pins.txt
          git diff --check
      - name: Fetch pinned portable tools
        run: bash snesrecomp/tools/ci/fetch_toolchain.sh --artifact windows-x64 --tag v1.0.14
      - name: Build ROM-independent analyzer
        run: |
          source "${TOOLCHAIN_DIR}/env.sh"
          rustup toolchain install 1.97.1-x86_64-pc-windows-gnullvm --profile minimal
          export RUSTUP_TOOLCHAIN=1.97.1-x86_64-pc-windows-gnullvm
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER="${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang.exe"
          python snesrecomp/tools/build_native_analyzer.py
      - name: Build setup host without ROM-derived sources
        run: |
          source "${TOOLCHAIN_DIR}/env.sh"
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SETUP_HOST=ON -DSNESRECOMP_FRAME_IMPL=LLE \
            -DSNESRECOMP_BUILD_VERSION="${RELEASE_VERSION}"
          cmake --build build-ci --parallel 4
          ./build-ci/ptbr_render_tests.exe
          ./build-ci/normal_character_tests.exe
          ./build-ci/normal_hud_tests.exe
          ./build-ci/selection_color_tests.exe
          ./build-ci/infinite_time_tests.exe
          ./build-ci/infinite_lives_tests.exe
          ./build-ci/com_level4_tests.exe
          ./build-ci/updater_tests.exe
          ./build-ci/normal_coop_tests.exe
          ./build-ci/subordinate_tests.exe
          ./build-ci/pause_menu_tests.exe
          ./build-ci/portal_labels_tests.exe
          ./build-ci/extra_characters_tests.exe
          ./build-ci/special_abilities_tests.exe
          ./build-ci/sb4_rom_tests.exe
          ./build-ci/gold_battle_tests.exe
          ./build-ci/louie_tests.exe
      - name: Package and audit Windows setup release
        run: |
          source "${TOOLCHAIN_DIR}/env.sh"
          bash scripts/package_release.sh build-ci windows-x64 --no-embed-toolchain
          python tools/finalize-release.py \
            --zip "dist/superbomberman5-${RELEASE_VERSION}-windows-x64.zip" \
            --build-dir build-ci \
            --analyzer snesrecomp/recompiler-rs/target/release/snesrecomp-analyze.exe \
            --toolchain "${TOOLCHAIN_DIR}" \
            --updater build-ci/SuperBomberman5Updater.exe \
            --rust-sysroot "$(rustup run 1.97.1-x86_64-pc-windows-gnullvm rustc --print sysroot)"
          python tools/audit-publication.py --zip "dist/superbomberman5-${RELEASE_VERSION}-windows-x64.zip"
          python tools/release-notes.py --output dist/notes.md
      - name: Smoke test setup host and packaged analyzer
        run: |
          source "${TOOLCHAIN_DIR}/env.sh"
          ./build-ci/SuperBomberman5Recomp.exe --help
          python tests/windows_entry_runtime.py --entry build-ci/SuperBomberman5Recomp.exe --cc "${TOOLCHAIN_DIR}/bin/clang.exe"
          python -c 'import os,pathlib,subprocess,sys,zipfile; v=os.environ["RELEASE_VERSION"]; p=pathlib.Path(".bootstrap/package-smoke"); zipfile.ZipFile(f"dist/superbomberman5-{v}-windows-x64.zip").extractall(p); exe=next(p.rglob("snesrecomp-analyze.exe")); subprocess.run([sys.executable,"tools/smoke-analyzer.py","--analyzer",str(exe.resolve())],check=True)'
      - uses: actions/upload-artifact@v4
        with:
          name: superbomberman5-windows-x64
          path: |
            dist/superbomberman5-*-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and pins
        run: |
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          python3 tools/audit-publication.py --history
          python3 -m unittest discover -s tests -v
          bash snesrecomp/tools/ci/record_pins.sh --check framework_pins.txt
      - name: Fetch portable Linux tools
        run: bash snesrecomp/tools/ci/fetch_toolchain.sh --artifact linux-x64 --tag v1.0.14
      - name: Build setup host and analyzer
        run: |
          source "${TOOLCHAIN_DIR}/env.sh"
          rustup toolchain install 1.97.1 --profile minimal
          export RUSTUP_TOOLCHAIN=1.97.1
          python3 snesrecomp/tools/build_native_analyzer.py
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_SETUP_HOST=ON -DSNESRECOMP_FRAME_IMPL=LLE -DCMAKE_BUILD_RPATH='$ORIGIN' -DSNESRECOMP_BUILD_VERSION="$RELEASE_VERSION"
          cmake --build build-ci --parallel 4
          ctest --test-dir build-ci --output-on-failure
      - name: Package and audit AppImage
        run: |
          source "${TOOLCHAIN_DIR}/env.sh"
          bash scripts/package_release.sh build-ci linux-x64 --no-embed-toolchain
          curl -fL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          echo '95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6  '"$RUNNER_TEMP/appimagetool" | sha256sum -c -
          curl -fL https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -o "$RUNNER_TEMP/runtime-x86_64"
          echo '617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  '"$RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          python3 tools/package-appimage.py --zip "dist/superbomberman5-${RELEASE_VERSION}-linux-x64.zip" --build-dir build-ci --analyzer snesrecomp/recompiler-rs/target/release/snesrecomp-analyze --rust-sysroot "$(rustup run 1.97.1 rustc --print sysroot)" --appimagetool "$RUNNER_TEMP/appimagetool" --runtime "$RUNNER_TEMP/runtime-x86_64"
      - name: Smoke test AppImage and writable setup
        run: |
          image="$PWD/dist/superbomberman5-${RELEASE_VERSION}-linux-x86_64.AppImage"
          XDG_DATA_HOME="$RUNNER_TEMP/sb5-smoke" "$image" --appimage-extract-and-run --help
          XDG_DATA_HOME="$RUNNER_TEMP/sb5-smoke" "$image" --appimage-extract-and-run --help
          python3 tools/smoke-analyzer.py --analyzer "$RUNNER_TEMP/sb5-smoke/superbomberman5/$RELEASE_VERSION/snesrecomp/recompiler-rs/target/release/snesrecomp-analyze"
          python3 tools/release-notes.py --output dist/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: superbomberman5-linux-x64
          path: |
            dist/*.AppImage
            dist/superbomberman5-*-linux-x64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [windows, linux]
    if: inputs.publish_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: superbomberman5-*
          path: dist
          merge-multiple: true
      - name: Verify tag and prepare notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v${RELEASE_VERSION}")" = "$GITHUB_SHA" || exit 1
          fi
          python3 tools/release-notes.py --output dist/notes.md
          cd dist
          sha256sum *.AppImage *-windows-x64.zip > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Super Bomberman 5 v${{ inputs.version }} — Linux AppImage + Windows ZIP
          body_path: dist/notes.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/*.AppImage
            dist/*-windows-x64.zip
            dist/SHA256SUMS
      - name: Announce in Discord #patch-notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
        run: |
          python3 tools/release-notes.py --whats-new --output dist/whats-new.md
          python3 tools/discord-release-post.py --version "${RELEASE_VERSION}" --notes dist/whats-new.md \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}"
