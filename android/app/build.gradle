apply plugin: 'com.android.application'

// Version shown on the phone = the game's VERSION file.
def gameVersion = new File(rootDir, '../VERSION').text.trim()
def parts = gameVersion.tokenize('.').collect { it.toInteger() }
def gameVersionCode = parts[0] * 10000 + parts[1] * 100 + parts[2]
// The native build stages mods/ and launcher assets here (see the root
// CMakeLists, tools/android-stage-assets.cmake); they ship as APK assets.
def sb5AssetDir = new File(buildDir, 'sb5-assets')
// Phones are arm64; CI's emulator test adds x86_64 with -Psb5Abis=arm64-v8a,x86_64.
def sb5Abis = (project.findProperty('sb5Abis') ?: 'arm64-v8a').toString().tokenize(',')

android {
    namespace "io.github.mauriciosuporte.sb5recomp"
    compileSdkVersion 34
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "io.github.mauriciosuporte.sb5recomp"
        // posix_spawn (recomp-ui launcher_files.c) needs bionic API 28+.
        minSdkVersion 28
        targetSdkVersion 34
        versionCode gameVersionCode
        versionName gameVersion
        externalNativeBuild {
            cmake {
                // The interpreter is the hot path: always build optimized.
                // SDL2 is the backend proven on Android by SuperMetroidRecomp.
                arguments "-DANDROID_STL=c++_static",
                          "-DCMAKE_BUILD_TYPE=Release",
                          "-DSNESRECOMP_SDL_BACKEND=SDL2",
                          "-DSNESRECOMP_FRAME_IMPL=LLE",
                          "-DSB5_INTERPRETER_ONLY=ON",
                          "-DBUILD_TESTING=OFF",
                          // Same lobby pin as the PC build of this version: crossplay.
                          "-DSNESRECOMP_BUILD_VERSION=${gameVersion}",
                          "-DSB5_ANDROID_ASSET_DIR=${sb5AssetDir.absolutePath}"
                abiFilters(*sb5Abis)
            }
        }
    }
    // Release signing: the same key for every release, or Android refuses to
    // install an update over the previous version. CI writes the keystore from
    // the ANDROID_KEYSTORE_BASE64 secret; without it the debug key is used
    // (test builds only: they cannot update a released install).
    def ksFile = System.getenv('SB5_KEYSTORE_FILE')
    def ksPass = System.getenv('SB5_KEYSTORE_PASSWORD')
    def haveReleaseKey = ksFile && ksPass && new File(ksFile).isFile()
    signingConfigs {
        if (haveReleaseKey) {
            sb5release {
                storeFile new File(ksFile)
                storePassword ksPass
                keyAlias 'sb5'
                keyPassword ksPass
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig haveReleaseKey ? signingConfigs.sb5release : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    // SDL's Java glue (org.libsdl.app) is copied from the pinned SDL2 source
    // release by android/fetch_sdl.sh and must version-match jni/SDL.
    sourceSets {
        main.assets.srcDirs += sb5AssetDir
    }
    lint {
        abortOnError false
    }
}

// The asset folder is filled by the native build's POST_BUILD step, so asset
// merging must wait for it.
tasks.configureEach { t ->
    if (t.name.startsWith('merge') && t.name.endsWith('Assets')) {
        t.dependsOn(tasks.matching { it.name.startsWith('buildCMake') || it.name.startsWith('externalNativeBuild') })
    }
}
