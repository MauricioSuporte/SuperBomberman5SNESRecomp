description = "Adds Super Bomberman 4's Bomberman and the Bomber Kings (Hammer, Jet, Lady, Bazooka and Great Bomber) as a third row of the character selection, with their five Super Bomberman 4 colors and their B + direction special abilities. Their graphics are read at runtime from your own Super Bomberman 4 ROM (Japanese release, SHA-256 68df561d…9f44), selected on this page. Includes the Honey and Kotetsu column. Requires host v0.11.0 or newer."
