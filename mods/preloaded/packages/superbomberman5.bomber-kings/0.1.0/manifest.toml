format_version = 1
id = "superbomberman5.bomber-kings"
version = "0.1.0"
name = "Bomber Kings — Super Bomberman 4 characters"
author = "MauricioSuporte"
description = "Adds Super Bomberman 4's Bomberman and the Bomber Kings (Hammer, Jet, Lady, Bazooka and Great Bomber) as a third row of the character selection, with their five Super Bomberman 4 colors and their B + direction special abilities. Their graphics are read at runtime from your own Super Bomberman 4 ROM (Japanese release, SHA-256 68df561d…9f44): place it next to the Super Bomberman 5 ROM or in a roms folder. Includes the Honey and Kotetsu column. Requires host v0.11.0 or newer."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "superbomberman5-jpn"
rom_sha256 = "5251e6491872dc51879b630a34d76a92e29ea0c39026c4f8773c1fe006d047c4"

[[feature]]
id = "bomber_kings"
name = "Play as the Bomber Kings"
description = "Three-row character selection: the Super Bomberman 4 Bomberman and the five Bomber Kings below the stock characters and Honey/Kotetsu. Needs your own Super Bomberman 4 ROM; without it the selection stays as before."
group = "Gameplay"
default_enabled = false
presentation_only = false

[[plugin]]
feature = "bomber_kings"
id = "superbomberman5.bomber-kings.characters"
