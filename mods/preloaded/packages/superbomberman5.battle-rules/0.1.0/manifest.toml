description = "Adds a second page to the Battle rules screen (Down on Bowling Bomber or Up on CPU Level) with two rules: Instant Start (default Yes; No gives a 3-2-1 countdown before each round, with the screen dimmed, inputs blocked and every bomber's number blinking on its spawn point) and a shuffle of all bombers' spawn points (default No). Requires a native host built with this mod."
