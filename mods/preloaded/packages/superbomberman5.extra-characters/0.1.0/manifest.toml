format_version = 1
id = "superbomberman5.extra-characters"
version = "0.1.0"
name = "Super Bomberman 5 extra characters"
author = "MauricioSuporte"
description = "Adds Super Bomberman 5's own extra characters to the character selection: Honey and Kotetsu (the secret-stage bosses of Zones 1-3), Emperor Terrorin (the last phase of ZONE5 - J) and Subordinate Bomber (in the X cell). They are drawn with their own cartridge frames and have B + direction special abilities. Works in Battle and, with the Normal character selection mod, in Normal Game. Replaces the separate Honey and Kotetsu and Subordinate Bomber mods. Requires host v0.13.0 or newer."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "superbomberman5-jpn"
rom_sha256 = "5251e6491872dc51879b630a34d76a92e29ea0c39026c4f8773c1fe006d047c4"

[[feature]]
id = "extra_characters"
name = "Play as the Super Bomberman 5 extra characters"
description = "Seven-column character selection: Honey and Terrorin end the top row, Kotetsu the second; Subordinate Bomber takes the X cell. B + direction: Honey's shot, Kotetsu's sword, Terrorin's barrier and Clock. L/R colors do not apply to Honey, Kotetsu and Terrorin."
group = "Gameplay"
default_enabled = false
presentation_only = false

[[plugin]]
feature = "extra_characters"
id = "superbomberman5.extra-characters.characters"
